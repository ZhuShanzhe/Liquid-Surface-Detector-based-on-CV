segmentation:
  backend: classical
  roi: [400, 150, 1000, 700]
  classical:
    saturation_max: 50
    value_min: 55
    value_max: 248
    ellipse_center_offset: [0, 80]
    ellipse_axis_margin: [90, 105]
    open_kernel: 15
    close_kernel: 41
    min_area: 3000
  torchscript:
    model_path: weights/liquid_surface.ts
    input_size: [512, 512]
    threshold: 0.5

illumination:
  # Keep correction opt-in until camera-specific dark-scene validation passes.
  # Diagnostics and quality rejection remain active even when correction is off.
  enabled: false
  preview_max_side: 320
  trigger_luma_p50: 0.22
  target_luma_p50: 0.42
  min_gamma: 0.45
  clahe_clip_limit: 1.5

complex_scene:
  # off: never use a specialist; auto: trigger by diagnostics/context; always: force one.
  mode: auto
  latency_budget_ms: 500.0
  enforce_latency_budget: true
  hold_frames: 8
  # An unavailable specialist makes the measurement explicitly invalid.
  missing_model_policy: reject
  auto:
    raw_depth_valid_ratio_below: 0.45
    saturated_pixel_ratio_above: 0.10
    luma_p50_below: 0.18
    dark_pixel_ratio_above: 0.70
    dynamic_range_below: 0.06
  # Optional per-camera defaults. A frame-local scene_context.json overrides these.
  scene_context: {}
  models:
    # v5 serves glare/depth-failure/low-light; v4 remains the transparent specialist.
    # Keep every route disabled until camera/container-specific qualification.
    glare:
      enabled: false
      backend: torchscript
      torchscript:
        model_path: /root/autodl-tmp/liquid-depth-artifacts/models/universal-liquid-v5-calibration-aware.ts
        input_size: [320, 180]
        min_depth_m: 0.1
        max_depth_m: 10.0
        depth_encoding: log
        preserve_valid_raw: false
        warmup: true
    depth_failure:
      enabled: false
      backend: torchscript
      torchscript:
        model_path: /root/autodl-tmp/liquid-depth-artifacts/models/universal-liquid-v5-calibration-aware.ts
        input_size: [320, 180]
        min_depth_m: 0.1
        max_depth_m: 10.0
        depth_encoding: log
        preserve_valid_raw: false
        warmup: true
    transparent_multilayer:
      enabled: false
      backend: torchscript
      torchscript:
        model_path: /root/autodl-tmp/liquid-depth-artifacts/models/universal-liquid-v4-top-dreds-ft.ts
        input_size: [320, 180]
        min_depth_m: 0.1
        max_depth_m: 10.0
        depth_encoding: log
        preserve_valid_raw: false
        warmup: true
    low_light:
      enabled: false
      backend: torchscript
      torchscript:
        model_path: /root/autodl-tmp/liquid-depth-artifacts/models/universal-liquid-v5-calibration-aware.ts
        input_size: [320, 180]
        min_depth_m: 0.1
        max_depth_m: 10.0
        depth_encoding: log
        preserve_valid_raw: false
        warmup: true

depth_refinement:
  # identity preserves the validated classical baseline. Switch to torchscript
  # after a transparent/specular RGB-D completion model passes offline evaluation.
  backend: identity
  torchscript:
    model_path: weights/depth_refiner.ts
    input_size: [640, 360]
    min_depth_m: 0.1
    max_depth_m: 3.0
    depth_encoding: linear
    warmup: true
  transcg_dfnet:
    source_path: /root/autodl-tmp/liquid-depth-data/research/sources/TransCG
    checkpoint_path: /root/autodl-tmp/liquid-depth-data/research/transcg/checkpoints/checkpoint.tar
    input_size: [320, 240]
    depth_min_m: 0.3
    depth_max_m: 1.0
    depth_coefficient: 3.0
    inpainting: true
  dreds_swindrnet:
    source_path: /root/autodl-tmp/liquid-depth-data/research/sources/DREDS/SwinDRNet
    checkpoint_path: /root/autodl-tmp/liquid-depth-data/research/dreds_std/archives/model.pth
    input_size: [224, 224]
    max_depth_m: 3.0


  cleargrasp:
    source_path: /root/autodl-tmp/liquid-depth-data/research/sources/ClearGrasp
    checkpoint_root: /root/autodl-tmp/liquid-depth-data/research/cleargrasp/extracted/cleargrasp-checkpoints/cleargrasp-checkpoints
    executable_path: /root/autodl-tmp/liquid-depth-data/research/sources/ClearGrasp/api/depth2depth/gaps/bin/x86_64/depth2depth
    inference_size: [256, 256]
    output_size: [256, 144]
    intrinsics: [185.0, 185.0, 128.0, 72.0]
    min_depth_m: 0.1
    max_depth_m: 1.5
    inertia_weight: 1000.0
    smoothness_weight: 0.001
    tangent_weight: 1.0

geometry:
  liquid_erode_px: 12
  meniscus_width_px: 12
  bottom_erode_px: 6
  ransac_threshold_m: 0.006
  max_points: 30000
  seed: 7
  min_depth_confidence: 0.25

surface_support:
  # Enables rejection of compact accidental patches while accepting a spatially
  # distributed partial plane when floating material or glare hides some surface.
  enabled: true
  horizontal_tiles: 6
  vertical_tiles: 4
  min_points_per_tile: 3
  min_tile_coverage: 0.30
  min_horizontal_span_ratio: 0.45
  min_vertical_span_ratio: 0.25
  min_convex_hull_coverage_ratio: 0.12
  min_fit_inlier_ratio: 0.25

bottom:
  roi: [400, 150, 1000, 700]
  ellipse_center_offset: [40, 70]
  ellipse_axes: [115, 85]

output:
  depth_unit: cm
  calibration_scale_per_meter: 100.0

quality:
  min_mask_area: 10000
  min_inlier_ratio: 0.30
  max_median_residual_m: 0.006
  min_mean_segmentation_confidence: 0.20
  min_mean_depth_confidence: 0.20
  max_plane_angle_deg: 15.0
  min_luma_p50: 0.05
  max_dark_pixel_ratio: 0.90
  max_saturated_pixel_ratio: 0.35
  min_dynamic_range: 0.03

temporal:
  # Enabled for ordered batch/video inference. Single-frame inference remains stateless.
  enabled: false
  # Units follow output.depth_unit (centimeters in the default configuration).
  process_variance: 0.01
  measurement_variance: 0.25
  gate_sigma: 3.5
  max_jump: 2.0
  min_confidence: 0.20
  # Rejected frames expose decayed prediction-only diagnostics, never fresh valid output.
  max_hold_frames: 3
  hold_confidence_decay: 0.65
