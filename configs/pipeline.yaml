segmentation:
  backend: classical
  roi: [400, 150, 1000, 700]
  classical:
    saturation_max: 50
    value_min: 55
    value_max: 248
    ellipse_center_offset: [0, 80]
    ellipse_axis_margin: [90, 105]
    open_kernel: 15
    close_kernel: 41
    min_area: 3000
  torchscript:
    model_path: weights/liquid_surface.ts
    input_size: [512, 512]
    threshold: 0.5

depth_refinement:
  # identity preserves the validated classical baseline. Switch to torchscript
  # after a transparent/specular RGB-D completion model passes offline evaluation.
  backend: identity
  torchscript:
    model_path: weights/depth_refiner.ts
    input_size: [640, 360]
    max_depth_m: 3.0
  transcg_dfnet:
    source_path: /root/autodl-tmp/liquid-depth-data/research/sources/TransCG
    checkpoint_path: /root/autodl-tmp/liquid-depth-data/research/transcg/checkpoints/checkpoint.tar
    input_size: [320, 240]
    depth_min_m: 0.3
    depth_max_m: 1.0
    depth_coefficient: 3.0
    inpainting: true
  dreds_swindrnet:
    source_path: /root/autodl-tmp/liquid-depth-data/research/sources/DREDS/SwinDRNet
    checkpoint_path: /root/autodl-tmp/liquid-depth-data/research/dreds_std/archives/model.pth
    input_size: [224, 224]
    max_depth_m: 3.0


  cleargrasp:
    source_path: /root/autodl-tmp/liquid-depth-data/research/sources/ClearGrasp
    checkpoint_root: /root/autodl-tmp/liquid-depth-data/research/cleargrasp/extracted/cleargrasp-checkpoints/cleargrasp-checkpoints
    executable_path: /root/autodl-tmp/liquid-depth-data/research/sources/ClearGrasp/api/depth2depth/gaps/bin/x86_64/depth2depth
    inference_size: [256, 256]
    output_size: [256, 144]
    intrinsics: [185.0, 185.0, 128.0, 72.0]
    min_depth_m: 0.1
    max_depth_m: 1.5
    inertia_weight: 1000.0
    smoothness_weight: 0.001
    tangent_weight: 1.0

geometry:
  liquid_erode_px: 12
  meniscus_width_px: 12
  bottom_erode_px: 6
  ransac_threshold_m: 0.006
  max_points: 30000
  seed: 7
  min_depth_confidence: 0.25

bottom:
  roi: [400, 150, 1000, 700]
  ellipse_center_offset: [40, 70]
  ellipse_axes: [115, 85]

output:
  depth_unit: cm
  calibration_scale_per_meter: 100.0

quality:
  min_mask_area: 10000
  min_inlier_ratio: 0.30
  max_median_residual_m: 0.006
  min_mean_segmentation_confidence: 0.20
  min_mean_depth_confidence: 0.20
  max_plane_angle_deg: 15.0

temporal:
  # Enabled for ordered batch/video inference. Single-frame inference remains stateless.
  enabled: false
  # Units follow output.depth_unit (centimeters in the default configuration).
  process_variance: 0.01
  measurement_variance: 0.25
  gate_sigma: 3.5
  max_jump: 2.0
  min_confidence: 0.20
