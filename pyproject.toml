[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquid-depth"
version = "0.2.0"
description = "RGB-D liquid perception, depth restoration, calibrated geometry, and evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]
train = [
  "torch>=2.7",
  "torchvision>=0.22",
  "albumentations>=2,<3",
  "tensorboard>=2.18,<3",
  "tqdm>=4.66,<5",
]
research = [
  "huggingface-hub>=0.30,<2",
  "gdown>=5,<6",
  "h5py>=3.11,<4",
  "OpenEXR>=3.3,<4",
  "einops>=0.8,<1",
  "imageio>=2.37,<3",
  "scipy>=1.13,<2",
  "timm>=1,<2",
  "yacs>=0.1.8,<1",
]
visualization = ["open3d>=0.19,<0.20"]

[project.scripts]
liquid-depth = "liquid_depth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["third_party"]
line-length = 110
target-version = "py310"
